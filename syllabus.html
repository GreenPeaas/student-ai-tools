<title>Syllabus Extractor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f8f7f4; --fg: #1a1a1a; --fg-muted: #6b6b6b;
    --surface: #ffffff; --border: #e2e0db;
    --accent: #2563eb; --accent-light: #dbeafe;
    --tag-bg: #f0f0ed;
    --pill-exam: #fef3c7; --pill-exam-fg: #92400e;
    --pill-assign: #dbeafe; --pill-assign-fg: #1e40af;
    --pill-project: #f3e8ff; --pill-project-fg: #6b21a8;
    --pill-other: #f0f0ed; --pill-other-fg: #525252;
    --font-display: 'Syne', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111110; --fg: #f0ede8; --fg-muted: #8a8783;
      --surface: #1c1c1a; --border: #2e2d2a;
      --accent: #3b82f6; --accent-light: #1e3a5f;
      --tag-bg: #222220;
      --pill-exam: #451a03; --pill-exam-fg: #fcd34d;
      --pill-assign: #1e3a5f; --pill-assign-fg: #93c5fd;
      --pill-project: #2e1065; --pill-project-fg: #c4b5fd;
      --pill-other: #222220; --pill-other-fg: #a3a3a3;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111110; --fg: #f0ede8; --fg-muted: #8a8783;
    --surface: #1c1c1a; --border: #2e2d2a;
    --accent: #3b82f6; --accent-light: #1e3a5f;
    --tag-bg: #222220;
    --pill-exam: #451a03; --pill-exam-fg: #fcd34d;
    --pill-assign: #1e3a5f; --pill-assign-fg: #93c5fd;
    --pill-project: #2e1065; --pill-project-fg: #c4b5fd;
    --pill-other: #222220; --pill-other-fg: #a3a3a3;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding-block: 20px; border-bottom: 1px solid var(--border);
    max-width: 760px; margin: 0 auto;
  }
  .nav-brand { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--fg); text-decoration: none; letter-spacing: -0.02em; }
  .nav-brand span { color: var(--accent); }
  .back-link { font-size: 0.85rem; color: var(--fg-muted); text-decoration: none; }
  .back-link:hover { color: var(--fg); }
  .page-wrap { max-width: 760px; margin: 0 auto; padding-block: 40px 80px; }
  .page-header { margin-bottom: 32px; }
  .tool-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); background: var(--accent-light); padding: 4px 10px; border-radius: 100px; margin-bottom: 12px; }
  h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; text-wrap: balance; margin-bottom: 8px; }
  .subtitle { font-size: 0.95rem; color: var(--fg-muted); max-width: 52ch; }
  .api-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .api-row input { flex: 1; min-width: 0; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); font-family: var(--font-body); font-size: 0.875rem; }
  .api-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .api-row input::placeholder { color: var(--fg-muted); }
  label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  textarea { width: 100%; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--fg); font-family: var(--font-body); font-size: 0.9rem; line-height: 1.6; resize: vertical; min-height: 200px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea::placeholder { color: var(--fg-muted); }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-family: var(--font-body); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-top: 12px; }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); opacity: 1; }
  .status-msg { padding: 12px 16px; border-radius: 8px; font-size: 0.875rem; margin-top: 12px; display: none; }
  .status-msg.error { background: #fee2e2; color: #b91c1c; display: block; }
  .status-msg.info { background: var(--accent-light); color: var(--accent); display: block; }
  .spinner { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* RESULTS */
  #results { margin-top: 36px; }
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .results-count { font-size: 0.85rem; color: var(--fg-muted); }

  .deadline-list { display: flex; flex-direction: column; gap: 8px; }
  .deadline-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .deadline-check {
    width: 18px; height: 18px; border: 2px solid var(--border);
    border-radius: 4px; flex-shrink: 0; margin-top: 2px; cursor: pointer;
    appearance: none; background: var(--surface);
  }
  .deadline-check:checked { background: var(--accent); border-color: var(--accent); }
  .deadline-check:checked::after { content: '✓'; display: block; color: white; font-size: 11px; text-align: center; line-height: 14px; }
  .deadline-body { flex: 1; min-width: 0; }
  .deadline-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 3px; }
  .deadline-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .deadline-date { font-size: 0.8rem; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .pill {
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 2px 7px; border-radius: 4px;
  }
  .pill-exam { background: var(--pill-exam); color: var(--pill-exam-fg); }
  .pill-assignment { background: var(--pill-assign); color: var(--pill-assign-fg); }
  .pill-project { background: var(--pill-project); color: var(--pill-project-fg); }
  .pill-other { background: var(--pill-other); color: var(--pill-other-fg); }

  @media (max-width: 600px) { h1 { font-size: 1.6rem; } }
</style>

<nav>
  <a class="nav-brand" href="index.html">Student<span>AI</span></a>
  <a class="back-link" href="index.html">← All tools</a>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <div class="tool-badge">📅 Organization</div>
    <h1>Syllabus Extractor</h1>
    <p class="subtitle">Paste your syllabus and get every assignment, exam, and deadline pulled into a clean checklist you can check off.</p>
  </div>

  <div class="api-row">
    <input type="password" id="api-key" placeholder="Paste your Anthropic API key (sk-ant-...)" autocomplete="off" spellcheck="false">
  </div>

  <div>
    <label for="syllabus-input">Paste your syllabus</label>
    <textarea id="syllabus-input" placeholder="Paste the full text of your course syllabus here..."></textarea>
    <button class="btn" id="extract-btn" onclick="extract()">
      <span id="btn-text">Extract Deadlines</span>
    </button>
  </div>

  <div id="status" class="status-msg"></div>

  <div id="results" hidden>
    <div class="results-header">
      <span class="results-count" id="count-label"></span>
      <button class="btn btn-ghost" onclick="copyAll()">Copy as text</button>
    </div>
    <div class="deadline-list" id="deadline-list"></div>
  </div>
</div>

<script>
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const deadlineList = document.getElementById('deadline-list');
const btnText = document.getElementById('btn-text');
const extractBtn = document.getElementById('extract-btn');

async function extract() {
  const apiKey = document.getElementById('api-key').value.trim();
  const syllabus = document.getElementById('syllabus-input').value.trim();
  if (!apiKey) { showStatus('Please enter your Anthropic API key above.', 'error'); return; }
  if (!syllabus) { showStatus('Please paste your syllabus text.', 'error'); return; }

  statusEl.className = 'status-msg'; statusEl.textContent = '';
  extractBtn.disabled = true;
  btnText.innerHTML = '<span class="spinner">⟳</span> Extracting…';
  resultsEl.hidden = true;

  const prompt = `You are a study assistant. Extract ALL assignments, exams, quizzes, projects, and important deadlines from this syllabus.

Return ONLY a JSON array (no markdown, no explanation):
[{"name": "item name", "date": "date string or 'TBD' if not listed", "type": "exam|assignment|project|other"}, ...]

Sort by date when possible. If no date is given, still include the item with date "TBD".

SYLLABUS:
${syllabus}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-3-haiku-20240307',
        max_tokens: 2048,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || `API error ${res.status}`); }
    const data = await res.json();
    const raw = data.content[0].text.trim();
    const jsonStr = raw.startsWith('[') ? raw : raw.match(/\[[\s\S]*\]/)?.[0];
    if (!jsonStr) throw new Error('Could not parse deadlines from response.');
    const items = JSON.parse(jsonStr);
    if (!Array.isArray(items) || items.length === 0) throw new Error('No deadlines found.');
    renderDeadlines(items);
  } catch(e) {
    showStatus('Error: ' + e.message, 'error');
  } finally {
    extractBtn.disabled = false;
    btnText.textContent = 'Extract Deadlines';
  }
}

function renderDeadlines(items) {
  deadlineList.innerHTML = '';
  items.forEach((item, i) => {
    const type = (item.type || 'other').toLowerCase();
    const pillClass = ['exam','assignment','project'].includes(type) ? 'pill-' + type : 'pill-other';
    const el = document.createElement('div');
    el.className = 'deadline-item';
    el.innerHTML = `
      <input type="checkbox" class="deadline-check" id="chk${i}" aria-label="Mark ${item.name} complete">
      <div class="deadline-body">
        <div class="deadline-name">${item.name}</div>
        <div class="deadline-meta">
          <span class="deadline-date">📅 ${item.date}</span>
          <span class="pill ${pillClass}">${type}</span>
        </div>
      </div>
    `;
    deadlineList.appendChild(el);
  });
  document.getElementById('count-label').textContent = items.length + ' items found';
  resultsEl.hidden = false;
  window._items = items;
}

function copyAll() {
  if (!window._items) return;
  const text = window._items.map(d => `[ ] ${d.name} — ${d.date} (${d.type})`).join('\n');
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
  const btn = event.target;
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy as text', 1800);
}

function showStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status-msg ' + type;
}
</script>
