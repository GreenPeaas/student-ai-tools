<title>Flashcard Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f8f7f4; --fg: #1a1a1a; --fg-muted: #6b6b6b;
    --surface: #ffffff; --border: #e2e0db;
    --accent: #2563eb; --accent-light: #dbeafe;
    --tag-bg: #f0f0ed; --success: #16a34a; --success-bg: #dcfce7;
    --font-display: 'Syne', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111110; --fg: #f0ede8; --fg-muted: #8a8783;
      --surface: #1c1c1a; --border: #2e2d2a;
      --accent: #3b82f6; --accent-light: #1e3a5f;
      --tag-bg: #222220; --success: #4ade80; --success-bg: #14532d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111110; --fg: #f0ede8; --fg-muted: #8a8783;
    --surface: #1c1c1a; --border: #2e2d2a;
    --accent: #3b82f6; --accent-light: #1e3a5f;
    --tag-bg: #222220; --success: #4ade80; --success-bg: #14532d;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding-block: 20px; border-bottom: 1px solid var(--border);
    max-width: 760px; margin: 0 auto;
  }
  .nav-brand {
    font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
    color: var(--fg); text-decoration: none; letter-spacing: -0.02em;
  }
  .nav-brand span { color: var(--accent); }
  .back-link {
    font-size: 0.85rem; color: var(--fg-muted); text-decoration: none;
    display: flex; align-items: center; gap: 4px;
  }
  .back-link:hover { color: var(--fg); }
  .page-wrap { max-width: 760px; margin: 0 auto; padding-block: 40px 80px; }
  .page-header { margin-bottom: 32px; }
  .tool-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--accent); background: var(--accent-light);
    padding: 4px 10px; border-radius: 100px; margin-bottom: 12px;
  }
  h1 {
    font-family: var(--font-display); font-size: 2rem; font-weight: 800;
    letter-spacing: -0.04em; line-height: 1.1; text-wrap: balance; margin-bottom: 8px;
  }
  .subtitle { font-size: 0.95rem; color: var(--fg-muted); max-width: 52ch; }

  /* API KEY */
  .api-row {
    display: flex; gap: 8px; margin-bottom: 24px; align-items: stretch;
  }
  .api-row input {
    flex: 1; min-width: 0; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--fg); font-family: var(--font-body); font-size: 0.875rem;
  }
  .api-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .api-row input::placeholder { color: var(--fg-muted); }

  /* FORM */
  label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  textarea {
    width: 100%; padding: 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--fg); font-family: var(--font-body);
    font-size: 0.9rem; line-height: 1.6; resize: vertical; min-height: 180px;
    transition: border-color 0.15s;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  textarea::placeholder { color: var(--fg-muted); }

  .options-row {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px;
  }
  .options-row select {
    padding: 8px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--fg); font-family: var(--font-body); font-size: 0.875rem;
    cursor: pointer;
  }
  .options-row select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; border: none;
    padding: 10px 20px; border-radius: 8px; font-family: var(--font-body);
    font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--accent); border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--accent); opacity: 1; }

  /* RESULTS */
  #results { margin-top: 36px; }
  .results-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
  }
  .results-count { font-size: 0.85rem; color: var(--fg-muted); }
  .card-list { display: flex; flex-direction: column; gap: 12px; }

  .flash-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .flash-q {
    padding: 16px 20px; font-weight: 600; font-size: 0.95rem;
    border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    user-select: none;
  }
  .flash-q:hover { background: var(--tag-bg); }
  .flash-toggle { font-size: 1rem; flex-shrink: 0; color: var(--accent); }
  .flash-a {
    padding: 14px 20px; font-size: 0.9rem; color: var(--fg-muted);
    line-height: 1.6; border-top: 1px solid var(--border);
  }
  .flash-a[hidden] { display: none !important; }

  /* COPY ALL */
  .copy-all-area { display: none; }

  .status-msg {
    padding: 12px 16px; border-radius: 8px; font-size: 0.875rem;
    margin-bottom: 12px; display: none;
  }
  .status-msg.error { background: #fee2e2; color: #b91c1c; display: block; }
  .status-msg.info { background: var(--accent-light); color: var(--accent); display: block; }
  .spinner { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) { h1 { font-size: 1.6rem; } }
</style>

<nav>
  <a class="nav-brand" href="index.html">Student<span>AI</span></a>
  <a class="back-link" href="index.html">← All tools</a>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <div class="tool-badge">🃏 Study</div>
    <h1>Flashcard Generator</h1>
    <p class="subtitle">Paste lecture notes or a textbook passage — get a full deck of Q&amp;A flashcards ready to review.</p>
  </div>

  <div class="api-row">
    <input type="password" id="api-key" placeholder="Paste your Anthropic API key (sk-ant-...)" autocomplete="off" spellcheck="false">
  </div>

  <div style="margin-bottom:16px;">
    <label for="notes-input">Your notes or passage</label>
    <textarea id="notes-input" placeholder="Paste lecture notes, a textbook section, or any study material here..."></textarea>
    <div class="options-row">
      <select id="card-count">
        <option value="8">8 cards</option>
        <option value="12" selected>12 cards</option>
        <option value="20">20 cards</option>
      </select>
      <button class="btn" id="generate-btn" onclick="generate()">
        <span id="btn-text">Generate Flashcards</span>
      </button>
    </div>
  </div>

  <div id="status" class="status-msg"></div>

  <div id="results" hidden>
    <div class="results-header">
      <span class="results-count" id="count-label"></span>
      <button class="btn btn-ghost" onclick="copyAll()">Copy all as text</button>
    </div>
    <div class="card-list" id="card-list"></div>
  </div>
</div>

<script>
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const cardList = document.getElementById('card-list');
const btnText = document.getElementById('btn-text');
const generateBtn = document.getElementById('generate-btn');

function showStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status-msg ' + type;
}

async function generate() {
  const apiKey = document.getElementById('api-key').value.trim();
  const notes = document.getElementById('notes-input').value.trim();
  const count = document.getElementById('card-count').value;

  if (!apiKey) { showStatus('Please enter your Anthropic API key above.', 'error'); return; }
  if (!notes) { showStatus('Please paste some notes or a passage first.', 'error'); return; }

  statusEl.className = 'status-msg'; statusEl.textContent = '';
  generateBtn.disabled = true;
  btnText.innerHTML = '<span class="spinner">⟳</span> Generating…';
  resultsEl.hidden = true;

  const prompt = `You are a study assistant. Given the following notes or passage, generate exactly ${count} flashcards for a college student.

Return ONLY a JSON array with this exact format (no markdown, no explanation, just the JSON):
[{"q": "question text", "a": "answer text"}, ...]

Make questions specific and testable. Answers should be concise (1-3 sentences).

NOTES:
${notes}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-3-haiku-20240307',
        max_tokens: 2048,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `API error ${res.status}`);
    }

    const data = await res.json();
    const raw = data.content[0].text.trim();
    const jsonStr = raw.startsWith('[') ? raw : raw.match(/\[[\s\S]*\]/)?.[0];
    if (!jsonStr) throw new Error('Could not parse flashcards from response.');

    const cards = JSON.parse(jsonStr);
    if (!Array.isArray(cards) || cards.length === 0) throw new Error('No cards returned.');

    renderCards(cards);
  } catch(e) {
    showStatus('Error: ' + e.message, 'error');
  } finally {
    generateBtn.disabled = false;
    btnText.textContent = 'Generate Flashcards';
  }
}

function renderCards(cards) {
  cardList.innerHTML = '';
  cards.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'flash-card';
    const aId = 'a' + i;
    el.innerHTML = `
      <div class="flash-q" onclick="toggleAnswer('${aId}', this)" aria-expanded="false">
        <span>${c.q}</span>
        <span class="flash-toggle" id="tog${i}">▼</span>
      </div>
      <div class="flash-a" id="${aId}" hidden>${c.a}</div>
    `;
    cardList.appendChild(el);
  });
  document.getElementById('count-label').textContent = cards.length + ' cards — click to reveal answers';
  resultsEl.hidden = false;
  window._cards = cards;
}

function toggleAnswer(id, btn) {
  const el = document.getElementById(id);
  const isHidden = el.hidden;
  el.hidden = !isHidden;
  btn.setAttribute('aria-expanded', String(isHidden));
  btn.querySelector('.flash-toggle').textContent = isHidden ? '▲' : '▼';
}

function copyAll() {
  if (!window._cards) return;
  const text = window._cards.map((c, i) => `Q${i+1}: ${c.q}\nA${i+1}: ${c.a}`).join('\n\n');
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
  const btn = event.target;
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy all as text', 1800);
}
</script>
